<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Clone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Section -->
    <header class="header">
        <div class="logo">
            <img src="flipkart.png" alt="Flipkart Logo">
        </div>
        <nav class="nav">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Shop</a></li>
                <li><a href="#">Offers</a></li>
                <li><a href="#">Cart</a></li>
            </ul>
        </nav>
    </header>

    <!-- Product Listing Section -->
    <section class="product-list">
        <h2>Top Deals</h2>
        <div class="product-container">
            <div class="product-card">
                <img src="mobile.jpg" alt="Product 1">
                <h3>Product 1</h3>
                <p>₹999</p>
                <button>Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="blutooth.webp" alt="Product 2">
                <h3>Product 2</h3>
                <p>₹1999</p>
                <button>Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="head.webp" alt="Product 3">
                <h3>Product 3</h3>
                <p>₹1499</p>
                <button>Add to Cart</button>
            </div>
        </div>
    </section>

    <!-- Footer Section -->
    <footer class="footer">
        <p>© 2026 Flipkart Clone. All Rights Reserved.</p>
    </footer>

</body>
</html>
